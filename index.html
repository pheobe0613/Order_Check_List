<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訂貨管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ec; --paper:#fffdf9; --ink:#2a2521; --muted:#8a8178; --line:#e6dfd4;
  --accent:#c4472b; --accent-ink:#fff; --soft:#f0ebe2;
  --ok:#2f7d4f; --ok-bg:#e3f2e8; --warn:#a86a00; --warn-bg:#fbefd5; --ship:#2d5f8f; --ship-bg:#e1ecf7;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}

/* header */
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header.top h1{font-size:22px;margin:0;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
header.top h1 .stamp{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;transform:rotate(-6deg)}
.savestate{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savestate.dirty .dot{background:var(--warn)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:#b42318;border-color:#f1c4bd}
.btn:disabled{opacity:.5;cursor:default}
.btn.icon{padding:8px 10px}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:500;color:var(--muted);white-space:nowrap;position:relative;bottom:-2px;border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab .n{font-size:12px;background:var(--soft);color:var(--muted);border-radius:999px;padding:0 7px;margin-left:4px}
.tab.on .n{background:#f7e1db;color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.hl .v{color:var(--accent)}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1;min-width:180px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px}
select.sel{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px}
.ipchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px}
.chip.on{outline:2px solid var(--ink);outline-offset:-1px}

/* list */
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:110px 120px 1fr 70px 150px 100px 44px;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{background:var(--soft);font-size:13px;color:var(--muted);font-weight:500;padding-top:8px;padding-bottom:8px}
.row.head > div{text-align:center}
.row.head > div:nth-child(3){text-align:left}
.thumb{width:110px;height:84px;border-radius:8px;border:1px solid var(--line);background:var(--soft);padding:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.c-ip,.c-pre,.c-ship{text-align:center}
.pill{display:inline-block;border-radius:6px;padding:2px 10px;font-size:14px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.name{font-weight:500;word-break:break-word}
.name.empty{color:var(--muted);font-weight:400}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.status{font-size:12px;border-radius:999px;padding:1px 9px;font-weight:500}
.s-wait{background:var(--soft);color:var(--muted)}
.s-ship{background:var(--ship-bg);color:var(--ship)}
.s-part{background:var(--warn-bg);color:var(--warn)}
.s-done{background:var(--ok-bg);color:var(--ok)}
.s-over{background:#efe4f7;color:#6b3d8f}
.cattag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.c-pre b{font-size:18px;font-variant-numeric:tabular-nums}
.lbl{display:none;font-size:12px;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.stepper button{border:0;background:transparent;width:34px;height:34px;font-size:18px;color:var(--muted)}
.stepper button:hover{background:var(--soft);color:var(--ink)}
.stepper input{width:44px;height:34px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;outline:none}
.c-arr{text-align:center}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{width:22px;height:22px;accent-color:var(--ship);cursor:pointer}
.chk span{display:none;font-size:13px}
.c-edit{border:0;background:transparent;width:36px;height:36px;border-radius:8px;color:var(--muted);font-size:16px}
.c-edit:hover{background:var(--soft);color:var(--ink)}
.empty-state{padding:48px 16px;text-align:center;color:var(--muted)}

@media (max-width:760px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stats .stat:nth-child(n+4){grid-column:span 1}
  .stat .v{font-size:18px}
  .row.head{display:none}
  .row{grid-template-columns:88px 1fr auto;grid-template-areas:"thumb ip edit" "thumb name name" "pre arr ship";gap:6px 12px;align-items:start}
  .thumb{grid-area:thumb;width:88px;height:88px}
  .c-ip{grid-area:ip;text-align:left}
  .c-name{grid-area:name}
  .c-pre{grid-area:pre;text-align:left;align-self:center}
  .c-arr{grid-area:arr;text-align:left;display:flex;align-items:center;gap:6px}
  .c-ship{grid-area:ship;align-self:center}
  .c-edit{grid-area:edit;justify-self:end;margin-top:-6px}
  .lbl{display:inline}
  .c-pre{display:flex;gap:6px;align-items:baseline}
  .chk span{display:inline}
  header.top h1{font-size:19px}
  header.top{gap:8px;flex-wrap:nowrap}
  .savestate{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  header.top .btn{padding:7px 10px;font-size:14px}
  .lbl,.chk span{white-space:nowrap}
  .stepper button{width:30px;height:32px}
  .stepper input{width:38px;height:32px}
  .search{min-width:100%}
  .filters .sel{flex:1}
}

/* modal */
.mask{position:fixed;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--paper);border-radius:16px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:18px;margin:0;padding:18px 20px 0}
.modal .body{padding:16px 20px}
.modal .foot{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--line)}
.field{margin-bottom:14px}
.field > label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input[type=text],.field input[type=number],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.field textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{border:2px dashed var(--line);border-radius:12px;min-height:150px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;overflow:hidden;position:relative;background:#fff}
.drop.over{border-color:var(--accent);background:#fdf3f0}
.drop img{max-width:100%;max-height:260px;display:block}
.drop .x{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;width:28px;height:28px}
.shipbox{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.shipbox input{width:20px;height:20px;accent-color:var(--ship)}
.zoom{max-width:min(92vw,900px);max-height:88vh;border-radius:10px;display:block;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.catrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.catrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.catrow .cnt{font-size:12px;color:var(--muted);width:48px;text-align:right}
.hint{font-size:12px;color:var(--muted)}
.sec{font-weight:700;margin:4px 0 10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}
textarea.mono{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:8px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.fab{display:none}
@media (max-width:760px){
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:28px;box-shadow:0 8px 20px rgba(196,71,43,.4);z-index:40}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="data">{"v":1,"savedAt":1794549841969,"cats":["一番賞","陀螺","盲盒","毛絨吊飾","扭蛋","盒玩","卡牌"],"items":[{"id":"a1","cat":"一番賞","ip":"海賊王","img":"","name":"明年的海賊一番賞","pre":3,"arr":"","ship":false,"note":""},{"id":"a2","cat":"一番賞","ip":"東京喰種","img":"","name":"好像也是明年的","pre":3,"arr":"","ship":false,"note":""},{"id":"a3","cat":"一番賞","ip":"三麗鷗","img":"","name":"","pre":1,"arr":"","ship":true,"note":""}]}</script>
<script id="app">
(function(){
"use strict";
const HEAD_HTML = document.head.innerHTML;
const APP_SRC = document.getElementById('app').textContent;
const EMBED = JSON.parse(document.getElementById('data').textContent);
let state = JSON.parse(JSON.stringify(EMBED));
let dirty = false;
let base = EMBED.savedAt;      // savedAt the local draft is based on
let artifact = null;            // claude.ai self-publish capability
let downloads = null;           // claude.ai file-save capability
let mode = 'pending';           // 'artifact' | 'file' | 'pending'
const ui = { tab:'__all', q:'', ip:'', status:'', sort:'order' };
const STORE_KEY = 'order-mgr:' + location.pathname;

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => (v === '' || v == null) ? null : Number(v);
const PALETTE = [['#d5e8ec','#2f5d68'],['#ecd9f3','#6b3d8f'],['#e6e3df','#4f4a44'],['#fde2d6','#a2401b'],['#dff0d8','#3d6b2f'],['#fff0c2','#806000'],['#dbe4fb','#2f4a8f'],['#f9dbe5','#97305a'],['#d8f1ec','#1f6b5c'],['#f3e3d3','#7a4a1e']];
function ipColor(ip){ let h=0; for (const ch of String(ip)) h = (h*31 + ch.codePointAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; }
function pill(ip){ if(!ip) return '<span class="pill" style="background:var(--soft);color:var(--muted)">未分類</span>'; const [b,f]=ipColor(ip); return `<span class="pill" style="background:${b};color:${f}">${esc(ip)}</span>`; }
function statusOf(it){
  const a = num(it.arr), p = Number(it.pre)||0;
  if (a != null && a > 0 && a > p && p > 0) return ['s-over','多到 '+(a-p)];
  if (a != null && p > 0 && a >= p) return ['s-done','已到齊'];
  if (a != null && a > 0) return ['s-part','缺 '+(p-a)];
  if (it.ship) return ['s-ship','已入港'];
  return ['s-wait','等待中'];
}
function statusKey(it){ return statusOf(it)[0]; }
let toastT;
function toast(msg){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }

/* ---------- local draft (IndexedDB) ---------- */
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('order-mgr',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function draftGet(){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(STORE_KEY); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function draftSet(v){ try{ const db=await idb(); await new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,STORE_KEY); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} }
let draftTimer;
function changed(){ dirty = true; clearTimeout(draftTimer); draftTimer = setTimeout(()=>draftSet({base, dirty:true, state}), 300); render(); }

/* ---------- export ---------- */
function buildHTML(st=state){
  const json = JSON.stringify(st).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="zh-Hant">\n<head>' + HEAD_HTML + '</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="data">' + json + '<\/script>\n<script id="app">' + APP_SRC + '<\/script>\n</body>\n</html>\n';
}
async function save(){
  if (mode === 'artifact'){
    const btn = $('#saveBtn'); if (btn){ btn.disabled = true; btn.textContent = '儲存中…'; }
    state.savedAt = Date.now();
    await draftSet({base:state.savedAt, dirty:false, state});
    try { await artifact.publish(buildHTML()); dirty=false; toast('已儲存'); }
    catch(e){
      const code = (e && (e.code || e.name || e.message)) || '';
      await draftSet({base, dirty:true, state});
      if (/not_writer|not_granted/.test(code)) toast('你只有檢視權限，無法儲存');
      else if (/conflict/.test(code)) toast('其他地方剛更新過，頁面將重新載入');
      else toast('儲存失敗：' + code);
      render();
    }
  } else {
    state.savedAt = Date.now();
    const blob = new Blob([buildHTML()], {type:'text/html'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    base = state.savedAt;
    await draftSet({base, dirty:false, state});
    dirty = false; render(); toast('已下載含最新資料的 HTML');
  }
}

async function exportHTML(){
  const html = buildHTML({...state, savedAt: Date.now()});
  const filename = 'index.html';
  if (downloads){
    try { await downloads.save({filename, data: html}); toast('已匯出 HTML'); }
    catch(e){ const c=(e&&(e.code||e.message))||''; if(!/cancel|declin|abort/i.test(c)) toast('匯出失敗：'+c); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('已匯出 HTML');
}

/* ---------- image ---------- */
function fileToDataURL(file, max=640, q=0.78){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = ()=>{ const s=Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('無法讀取圖片')); };
    img.src = url;
  });
}

/* ---------- view ---------- */
function visibleItems(){
  const q = ui.q.trim().toLowerCase();
  let list = state.items.filter(it =>
    (ui.tab === '__all' || it.cat === ui.tab) &&
    (!ui.ip || it.ip === ui.ip) &&
    (!ui.status || statusKey(it) === ui.status || (ui.status==='pending' && !['s-done','s-over'].includes(statusKey(it)))) &&
    (!q || [it.ip,it.name,it.note,it.cat].join(' ').toLowerCase().includes(q))
  );
  if (ui.sort === 'ip') list = list.slice().sort((a,b)=> (a.ip||'').localeCompare(b.ip||'','zh-Hant'));
  if (ui.sort === 'status'){ const o={'s-wait':0,'s-ship':1,'s-part':2,'s-over':3,'s-done':4}; list = list.slice().sort((a,b)=>o[statusKey(a)]-o[statusKey(b)]); }
  if (ui.sort === 'new') list = list.slice().reverse();
  return list;
}
function render(){
  const tabItems = state.items.filter(it => ui.tab==='__all' || it.cat===ui.tab);
  const ips = [...new Set(tabItems.map(it=>it.ip).filter(Boolean))];
  if (ui.ip && !ips.includes(ui.ip)) ui.ip = '';
  const list = visibleItems();
  const sum = (arr,f)=>arr.reduce((s,x)=>s+(f(x)||0),0);
  const pre = sum(list,x=>Number(x.pre)), arr = sum(list,x=>num(x.arr)||0);
  const shipped = list.filter(x=>x.ship).length;
  const lacking = sum(list, x=> Math.max(0,(Number(x.pre)||0)-(num(x.arr)||0)));
  const count = c => state.items.filter(it=>it.cat===c).length;
  const saveLabel = mode==='artifact' ? '儲存' : mode==='file' ? '下載 HTML' : '…';

  $('#root').innerHTML = `
  <div class="wrap">
    <header class="top">
      <h1><span class="stamp">訂</span>訂貨管理</h1>
      <span class="savestate ${dirty?'dirty':''}"><span class="dot"></span>${dirty ? (mode==='file'?'已存在這台裝置，尚未匯出':'尚未儲存') : '已儲存'}</span>
      <span class="spacer"></span>
      <button class="btn icon" data-act="settings" title="設定">⚙︎<span class="hide-m">設定</span></button>
      ${mode==='artifact' && downloads ? '<button class="btn" data-act="export" title="匯出含最新資料的 HTML">⇩<span class="hide-m">匯出 HTML</span></button>' : ''}
      <button class="btn ${mode==='artifact'&&dirty?'primary':''}" id="saveBtn" data-act="save" ${mode==='pending'?'disabled':''}>${saveLabel}</button>
      <button class="btn primary hide-m" data-act="add">＋ 新增商品</button>
    </header>

    <nav class="tabs">
      <button class="tab ${ui.tab==='__all'?'on':''}" data-tab="__all">全部<span class="n">${state.items.length}</span></button>
      ${state.cats.map(c=>`<button class="tab ${ui.tab===c?'on':''}" data-tab="${esc(c)}">${esc(c)}<span class="n">${count(c)}</span></button>`).join('')}
    </nav>

    <section class="stats">
      <div class="stat"><div class="k">品項</div><div class="v">${list.length}</div></div>
      <div class="stat"><div class="k">預購數量</div><div class="v">${pre}</div></div>
      <div class="stat"><div class="k">已到貨</div><div class="v">${arr}</div></div>
      <div class="stat hl"><div class="k">尚缺</div><div class="v">${lacking}</div></div>
      <div class="stat"><div class="k">大船入港</div><div class="v">${shipped}<span style="font-size:13px;color:var(--muted);font-weight:400"> / ${list.length}</span></div></div>
    </section>

    <div class="filters">
      <input class="search" id="q" placeholder="搜尋 IP、名字、備註…" value="${esc(ui.q)}">
      <select class="sel" id="fStatus">
        ${[['','全部狀態'],['pending','未到齊'],['s-wait','等待中'],['s-ship','已入港'],['s-part','部分到貨'],['s-done','已到齊'],['s-over','多到']].map(([v,t])=>`<option value="${v}" ${ui.status===v?'selected':''}>${t}</option>`).join('')}
      </select>
      <select class="sel" id="fSort">
        ${[['order','新增順序'],['new','最新在前'],['ip','依 IP'],['status','依狀態']].map(([v,t])=>`<option value="${v}" ${ui.sort===v?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    ${ips.length>1 ? `<div class="ipchips"><button class="chip ${!ui.ip?'on':''}" data-ip="">全部 IP</button>${ips.map(ip=>{const [b,f]=ipColor(ip);return `<button class="chip ${ui.ip===ip?'on':''}" data-ip="${esc(ip)}" style="background:${b};color:${f};border-color:${b}">${esc(ip)}</button>`}).join('')}</div>` : ''}

    <div class="list">
      ${list.length ? `<div class="row head"><div>圖片</div><div>IP</div><div>名字</div><div>預購</div><div>實際到貨</div><div>大船入港</div><div></div></div>` + list.map(rowHTML).join('')
        : `<div class="empty-state">${state.items.length ? '沒有符合條件的商品' : '還沒有商品，按「新增商品」開始'}</div>`}
    </div>
  </div>
  <button class="fab" data-act="add" aria-label="新增商品">＋</button>`;
}
function rowHTML(it){
  const [sc, st] = statusOf(it);
  return `<div class="row" data-id="${esc(it.id)}">
    <button class="thumb" data-act="${it.img?'zoom':'edit'}">${it.img?`<img src="${it.img}" alt="">`:'＋ 圖片'}</button>
    <div class="c-ip">${pill(it.ip)}</div>
    <div class="c-name">
      <div class="name ${it.name?'':'empty'}">${it.name?esc(it.name):'（未命名）'}</div>
      ${it.note?`<div class="note">${esc(it.note)}</div>`:''}
      <div class="meta"><span class="status ${sc}">${st}</span>${ui.tab==='__all'?`<span class="cattag">${esc(it.cat)}</span>`:''}</div>
    </div>
    <div class="c-pre"><span class="lbl">預購</span><b>${Number(it.pre)||0}</b></div>
    <div class="c-arr"><span class="lbl">實到</span><div class="stepper"><button data-act="dec" aria-label="減少">−</button><input data-act="arr" inputmode="numeric" placeholder="—" value="${it.arr===''||it.arr==null?'':esc(it.arr)}"><button data-act="inc" aria-label="增加">＋</button></div></div>
    <div class="c-ship"><label class="chk"><input type="checkbox" data-act="ship" ${it.ship?'checked':''}><span>大船入港</span></label></div>
    <button class="c-edit" data-act="edit" title="編輯">✎</button>
  </div>`;
}

/* ---------- modals ---------- */
function openModal(html, wide){
  closeModal();
  const m = document.createElement('div'); m.className='mask'; m.id='mask';
  m.innerHTML = html;
  m.addEventListener('mousedown', e=>{ if(e.target===m) closeModal(); });
  document.body.appendChild(m);
  return m;
}
function closeModal(){ const m=$('#mask'); if(m) m.remove(); }
function ask(msg, okText='確定', danger=true){
  return new Promise(res=>{
    const m = openModal(`<div class="modal" style="max-width:380px"><div class="body" style="padding-top:22px">${esc(msg)}</div><div class="foot"><span class="spacer"></span><button class="btn" data-r="0">取消</button><button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(okText)}</button></div></div>`);
    m.addEventListener('click', e=>{ const b=e.target.closest('[data-r]'); if(b){ closeModal(); res(b.dataset.r==='1'); } });
  });
}
function editItem(id){
  const it = id ? state.items.find(x=>x.id===id) : null;
  const d = it ? {...it} : {id:uid(), cat: ui.tab==='__all' ? state.cats[0] : ui.tab, ip: ui.ip||'', img:'', name:'', pre:1, arr:'', ship:false, note:''};
  const allIps = [...new Set(state.items.map(x=>x.ip).filter(Boolean))];
  const m = openModal(`<form class="modal" id="f">
    <h2>${it?'編輯商品':'新增商品'}</h2>
    <div class="body">
      <div class="field"><label>圖片（點選、拖曳或直接貼上）</label>
        <div class="drop" id="drop">${d.img?`<img src="${d.img}"><button type="button" class="x" id="rmImg" aria-label="移除">✕</button>`:'<div>📷<br>點選上傳圖片<br><span class="hint">也可以拖曳或 Ctrl+V 貼上</span></div>'}</div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="grid2">
        <div class="field"><label>分類</label><select id="fcat">${state.cats.map(c=>`<option ${c===d.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
        <div class="field"><label>IP</label><input type="text" id="fip" list="iplist" value="${esc(d.ip)}" placeholder="例如：海賊王"><datalist id="iplist">${allIps.map(i=>`<option value="${esc(i)}">`).join('')}</datalist></div>
      </div>
      <div class="field"><label>名字</label><input type="text" id="fname" value="${esc(d.name)}" placeholder="商品名稱"></div>
      <div class="grid2">
        <div class="field"><label>預購數量</label><input type="number" min="0" id="fpre" value="${esc(d.pre)}"></div>
        <div class="field"><label>實際到貨數量</label><input type="number" min="0" id="farr" value="${esc(d.arr)}" placeholder="還沒到可留空"></div>
      </div>
      <div class="field"><label class="shipbox"><input type="checkbox" id="fship" ${d.ship?'checked':''}> 大船入港</label></div>
      <div class="field"><label>備註</label><textarea id="fnote" placeholder="發售時間、價格、賣家…">${esc(d.note)}</textarea></div>
    </div>
    <div class="foot">
      ${it?'<button type="button" class="btn danger" id="del">刪除</button>':''}
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancel">取消</button>
      <button type="submit" class="btn primary">${it?'儲存變更':'新增'}</button>
    </div>
  </form>`);
  const drop = $('#drop',m), file = $('#file',m);
  const setImg = async f => { if(!f || !/^image\//.test(f.type)) return; try{ d.img = await fileToDataURL(f); drop.innerHTML = `<img src="${d.img}"><button type="button" class="x" id="rmImg" aria-label="移除">✕</button>`; }catch(e){ toast(e.message); } };
  drop.addEventListener('click', e=>{ if(e.target.closest('#rmImg')){ e.stopPropagation(); d.img=''; drop.innerHTML='<div>📷<br>點選上傳圖片<br><span class="hint">也可以拖曳或 Ctrl+V 貼上</span></div>'; return; } file.click(); });
  file.addEventListener('change', ()=> setImg(file.files[0]));
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', ()=> drop.classList.remove('over'));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('over'); setImg(e.dataTransfer.files[0]); });
  m.addEventListener('paste', e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>/^image\//.test(f.type)); if(f){ e.preventDefault(); setImg(f); } });
  $('#cancel',m).onclick = closeModal;
  if (it) $('#del',m).onclick = async ()=>{ if(await ask('確定刪除這個商品？','刪除')){ state.items = state.items.filter(x=>x.id!==it.id); changed(); } else editItem(it.id); };
  $('#f',m).addEventListener('submit', e=>{
    e.preventDefault();
    d.cat = $('#fcat',m).value; d.ip = $('#fip',m).value.trim(); d.name = $('#fname',m).value.trim();
    d.pre = Math.max(0, parseInt($('#fpre',m).value,10)||0);
    const a = $('#farr',m).value.trim(); d.arr = a==='' ? '' : Math.max(0, parseInt(a,10)||0);
    d.ship = $('#fship',m).checked; d.note = $('#fnote',m).value.trim();
    if (it) Object.assign(it, d); else state.items.push(d);
    closeModal(); changed(); toast(it?'已更新':'已新增');
  });
  if(!it) $('#fip',m).focus();
}
function settings(){
  const m = openModal(`<div class="modal">
    <h2>設定</h2>
    <div class="body">
      <div class="sec">分類分頁</div>
      <div id="cats"></div>
      <div class="catrow"><input id="newcat" placeholder="新增分類名稱"><button class="btn" id="addcat">新增</button></div>
      <hr class="sep">
      <div class="sec">資料備份</div>
      <p class="hint" style="margin-top:0">複製下面的 JSON 存起來就是完整備份（含圖片）。要還原時貼回來按「匯入」。</p>
      <textarea class="mono" id="json"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
        <button class="btn" id="copy">複製備份</button>
        <button class="btn" id="imp">匯入（取代目前資料）</button>
        <label class="btn">從檔案匯入<input type="file" id="impfile" accept=".json,application/json" hidden></label>
      </div>
    </div>
    <div class="foot"><span class="spacer"></span><button class="btn primary" id="close">完成</button></div>
  </div>`);
  const drawCats = ()=>{
    $('#cats',m).innerHTML = state.cats.map((c,i)=>`<div class="catrow" data-i="${i}">
      <button class="btn icon" data-mv="-1" ${i===0?'disabled':''} title="上移">↑</button>
      <input value="${esc(c)}" data-rn>
      <span class="cnt">${state.items.filter(x=>x.cat===c).length} 項</span>
      <button class="btn icon danger" data-rm title="刪除">✕</button></div>`).join('');
  };
  drawCats();
  $('#json',m).value = JSON.stringify(state);
  $('#cats',m).addEventListener('change', e=>{
    const inp = e.target.closest('[data-rn]'); if(!inp) return;
    const i = +inp.closest('.catrow').dataset.i, old = state.cats[i], nv = inp.value.trim();
    if (!nv || (nv!==old && state.cats.includes(nv))){ toast('名稱不可空白或重複'); inp.value = old; return; }
    state.cats[i] = nv; state.items.forEach(x=>{ if(x.cat===old) x.cat=nv; }); if(ui.tab===old) ui.tab=nv; changed();
  });
  $('#cats',m).addEventListener('click', async e=>{
    const row = e.target.closest('.catrow'); if(!row) return; const i = +row.dataset.i;
    if (e.target.closest('[data-mv]')){ const [c]=state.cats.splice(i,1); state.cats.splice(i-1,0,c); changed(); drawCats(); }
    if (e.target.closest('[data-rm]')){
      const c = state.cats[i], n = state.items.filter(x=>x.cat===c).length;
      if (n){ toast(`「${c}」裡還有 ${n} 項商品，請先移到其他分類`); return; }
      state.cats.splice(i,1); if(ui.tab===c) ui.tab='__all'; changed(); drawCats();
    }
  });
  $('#addcat',m).onclick = ()=>{ const v=$('#newcat',m).value.trim(); if(!v||state.cats.includes(v)) return toast('名稱不可空白或重複'); state.cats.push(v); $('#newcat',m).value=''; changed(); drawCats(); };
  $('#copy',m).onclick = async ()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(state)); toast('已複製'); }catch(e){ $('#json',m).select(); toast('請手動複製選取的文字'); } };
  const doImport = async txt => {
    try{ const s = JSON.parse(txt); if(!Array.isArray(s.items)||!Array.isArray(s.cats)) throw 0;
      if(!(await ask(`匯入 ${s.items.length} 項商品並取代目前資料？`,'匯入'))) return settings();
      state = {v:1, savedAt:state.savedAt, cats:s.cats, items:s.items}; ui.tab='__all'; changed(); toast('已匯入');
    }catch(e){ toast('格式不正確，無法匯入'); }
  };
  $('#imp',m).onclick = ()=> doImport($('#json',m).value);
  $('#impfile',m).onchange = async e=>{ const f=e.target.files[0]; if(f) doImport(await f.text()); };
  $('#close',m).onclick = closeModal;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target;
  const tab = t.closest('[data-tab]'); if (tab){ ui.tab = tab.dataset.tab; ui.ip=''; render(); return; }
  const chip = t.closest('[data-ip]'); if (chip && !t.closest('.modal')){ ui.ip = chip.dataset.ip; render(); return; }
  const a = t.closest('[data-act]'); if (!a || t.closest('.modal')) return;
  const act = a.dataset.act, row = a.closest('.row'), it = row && state.items.find(x=>x.id===row.dataset.id);
  if (act==='add') editItem();
  else if (act==='save') save();
  else if (act==='export') exportHTML();
  else if (act==='settings') settings();
  else if (act==='edit' && it) editItem(it.id);
  else if (act==='zoom' && it){ const m=openModal(`<img class="zoom" src="${it.img}" alt="">`); m.addEventListener('click',closeModal); }
  else if (act==='inc' && it){ it.arr = (num(it.arr)||0)+1; changed(); }
  else if (act==='dec' && it){ const v=num(it.arr); it.arr = v==null||v<=0 ? '' : v-1; changed(); }
});
document.addEventListener('change', e=>{
  const t = e.target; if (t.closest('.modal')) return;
  const row = t.closest('.row'), it = row && state.items.find(x=>x.id===row.dataset.id);
  if (t.dataset.act==='ship' && it){ it.ship = t.checked; changed(); }
  else if (t.dataset.act==='arr' && it){ const v=t.value.trim(); it.arr = v==='' ? '' : Math.max(0,parseInt(v,10)||0); changed(); }
  else if (t.id==='fStatus'){ ui.status=t.value; render(); }
  else if (t.id==='fSort'){ ui.sort=t.value; render(); }
});
function onSearch(e){
  if (e.target.id==='q'){ ui.q = e.target.value; const pos=e.target.selectionStart; render(); const q=$('#q'); q.focus(); try{ q.setSelectionRange(pos,pos);}catch(_){} }
}
document.addEventListener('input', e=>{ if(!e.isComposing) onSearch(e); });
document.addEventListener('compositionend', onSearch);
document.addEventListener('keydown', e=>{
  if (e.key==='Escape') closeModal();
  if ((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); if(mode!=='pending') save(); }
  if (e.key==='Enter' && e.target.dataset && e.target.dataset.act==='arr') e.target.blur();
});
window.addEventListener('beforeunload', e=>{ if (dirty && mode==='artifact'){ e.preventDefault(); e.returnValue=''; } });

/* ---------- boot ---------- */
render();
(async ()=>{
  const d = await draftGet();
  if (d && d.state && Array.isArray(d.state.items) && d.base >= EMBED.savedAt){ state = d.state; base = d.base; dirty = !!d.dirty; }
  if (window.claude && typeof window.claude.use === 'function'){
    try { [artifact, downloads] = await Promise.all([window.claude.use('artifact'), window.claude.use('downloads')]); } catch(e){}
  }
  mode = artifact ? 'artifact' : 'file';
  render();
})();
})();
</script>
</body>
</html>
